worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 5184k;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/access/server.crt;
        ssl_certificate_key /run/access/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "Plankton closed demo";
        auth_basic_user_file /run/access/htpasswd;
        location / {
            proxy_pass http://unix:/run/plankton/app.sock;
            proxy_read_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-By "";
            proxy_set_header X-Real-IP "";
        }
    }
}
